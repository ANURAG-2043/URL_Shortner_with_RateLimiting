<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="shortener-card">
        <div class="header">
            <span class="icon">🔗</span>
            <h1>Shorten Your Link</h1>
        </div>
        <p class="subtitle">Paste your long URL below to create a concise, shareable link.</p>

        <div class="input-group">
            <input type="url" id="urlInput" placeholder="https://example.com/very-long-url" required>
            <button onclick="shortenUrl()" id="shortenBtn">Shorten</button>
        </div>

        <div id="result" class="result-box hidden">
            </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
